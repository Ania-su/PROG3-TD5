openapi: 3.1.0
info:
  title: Ingredients
  version: 1.0.0
servers:
  - url: http://localhost:8080
paths:
  /ingredients:
    get:
      description: Return Ingredients
      responses:
        "200":
          description : Ingredient found
          content:
            application/json:
              schema:
                $ref : "#/components/schemas/Ingredient"

  /ingredients/{id}:
    get:
      description: Return one ingredient by id
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Ingredient found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ingredient"
        "404":
          description: Ingredient not found
          content:
            text/plain:
              schema:
                type: string
  /dishes:
    get:
      description: Return dishes with ingredients
      responses:
        "200":
          description: Dish list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Dish"
components:
  schemas:
    Ingredient:
      type: object
      properties:
        id:
          type: int
          example: 2
        name:
          type: string
          example: "Ania"
        price:
          type: double
          example : 120.0
        category :
          type: string
          enum: [VEGETABLE, ANIMAL, MARINE,DIARY, OTHER]
        stock_movement:
          type: list
          allOf:
            - $ref : "#/components/schemas/StockMovement"

    StockMovement:
      type: object
      properties:
        id:
          type: int
          example : 2
        stock_value:
          type: object
          allOf:
            - $ref : "#/components/schemas/StockValue"
        movement_type:
          type: string
          enum: [IN, OUT]
        creation_datetime:
          type: string
          format: datetime

    StockValue:
      type: object
      properties:
        quantity:
          type: double
          example : 12.0
        unit:
          type: string
          enum: [PCS, KG, L ]

    Dish:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: "Salade de pâtes"
        dish_type:
          type: string
          enum: [START, MAIN, DESSERT]
        sellingPrice:
          type: number
          format: double
          example: 120.3
        ingredients:
          type: array
          items:
            $ref: "#/components/schemas/Ingredient"